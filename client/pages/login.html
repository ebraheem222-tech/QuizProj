<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizProj | התחברות</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header id="appHeader"></header>
  <main class="page-shell">
    <section class="panel auth-panel">
      <h1>התחברות</h1>
      <div id="loginMessage"></div>
      <form id="loginForm" class="form-grid">
        <label class="form-field">
          אימייל או תעודת זהות
          <input class="form-control" name="identifier" autocomplete="username" required>
        </label>
        <label class="form-field">
          סיסמה
          <input class="form-control" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit">כניסה</button>
      </form>
    </section>
  </main>
  <script type="module" src="../assets/js/pages/login.js"></script>
</body>
</html>
