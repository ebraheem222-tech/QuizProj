<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizProj | מורה</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header id="appHeader"></header>
  <main class="page-shell">
    <section class="page-heading">
      <div>
        <p class="section-kicker">אזור מורה</p>
        <h1>ניהול מבחנים</h1>
      </div>
      <a class="btn btn-outline-primary" data-nav="search" href="/search">חיפוש מבחנים</a>
    </section>

    <div id="teacherMessage"></div>
    <section id="teacherDashboard" class="stats-grid"></section>
    <section class="content-grid teacher-layout">
      <article class="panel">
        <h2>יצירת מבחן</h2>
        <form id="examForm" class="form-grid"></form>
      </article>
      <article class="panel">
        <div class="panel-title-row">
          <h2>המבחנים שלי</h2>
          <input id="teacherSearchInput" class="form-control compact-input" placeholder="חיפוש לפי שם או קוד">
        </div>
        <div id="teacherExamList" class="stack-list"></div>
      </article>
    </section>
  </main>
  <script type="module" src="../assets/js/pages/teacher.js"></script>
</body>
</html>
