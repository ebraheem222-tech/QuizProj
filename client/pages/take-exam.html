<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizProj | ביצוע מבחן</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header id="appHeader"></header>
  <main class="page-shell exam-runner-shell">
    <section class="page-heading">
      <div>
        <p class="section-kicker">ביצוע מבחן</p>
        <h1 id="takeExamTitle">מבחן</h1>
      </div>
    </section>

    <section class="exam-status-bar" aria-label="מצב המבחן">
      <div id="timerBox" class="timer-box" role="timer" aria-live="polite">
        <span>זמן שנותר</span>
        <strong id="timerValue">--:--</strong>
      </div>
      <div class="exam-progress-box">
        <div class="exam-progress-text">
          <span>התקדמות</span>
          <strong id="answeredCount">0 מתוך 0 נענו</strong>
        </div>
        <div
          id="examProgressTrack"
          class="exam-progress-track"
          role="progressbar"
          aria-label="שאלות שנענו"
          aria-valuemin="0"
          aria-valuemax="0"
          aria-valuenow="0"
        >
          <span id="examProgressBar"></span>
        </div>
      </div>
    </section>

    <div id="takeExamMessage"></div>
    <form id="takeExamForm" class="exam-form"></form>
    <section id="examResultBox"></section>

    <dialog id="examExitDialog" class="exam-exit-dialog" aria-labelledby="examExitDialogTitle">
      <form method="dialog" class="exam-exit-content">
        <p class="section-kicker">אזהרה</p>
        <h2 id="examExitDialogTitle">לסיים את המבחן?</h2>
        <p>יציאה מהדף תסיים את המבחן. כל התשובות שנבחרו יישמרו והתוצאה תוצג מיד.</p>
        <p id="examExitAnswerStatus" class="exam-exit-answer-status"></p>
        <div class="exam-exit-actions">
          <button class="btn btn-outline-secondary" value="cancel" type="submit">המשך במבחן</button>
          <button class="btn btn-danger" id="confirmExamExitButton" type="button">סיום ושמירת תשובות</button>
        </div>
      </form>
    </dialog>
  </main>
  <script type="module" src="../assets/js/pages/take-exam.js"></script>
</body>
</html>
